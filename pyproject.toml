[project]
name = "film-memory-agent-demo"
version = "0.1.0"
description = "Nicole: a cinematic film assistant with memory and durable progress"
requires-python = ">=3.11"
dependencies = [
    "rich>=13,<15",
    "temporalio>=1.34,<2",
    "httpx>=0.28,<1",
    "boto3[crt]>=1.42,<2",
    "anthropic>=0.120,<1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.scripts]
nicole = "nicole.cli:main"

[project.optional-dependencies]
agentcore = [
    "bedrock-agentcore>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nicole = ["data/*.json"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
